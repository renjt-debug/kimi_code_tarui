[package]
name = "kimi-web-tauri"
version = "0.2.0"
description = "Tauri desktop launcher for the Kimi Code web UI"
authors = ["Ren.Jinting (任晋廷)"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kimi_web_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# 与依赖树中既有版本保持一致（wry/webview2 侧已在用 0.61.x）
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_System_Com",
] }
