<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Kimi Code</title>
  <style>
    html, body { height: 100%; margin: 0; display: grid; place-items: center;
                 background: #0b0d12; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .box { text-align: center; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
               border: 3px solid rgba(255,255,255,.08); border-top-color: #3d6bff;
               animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { color: #e6e8ee; font-size: 15px; font-weight: 600; letter-spacing: .06em; }
    .hint  { color: #9aa1ad; font-size: 12px; margin-top: 8px; }
    #status { color: #3d6bff; font-size: 12px; margin-top: 14px; min-height: 1em;
              max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="title">Kimi Code</div>
    <div class="hint">正在启动 kimi web 服务，请稍候…</div>
    <div id="status"></div>
  </div>
  <script>
    window.__kimiStatus__ = function (text) {
      var el = document.getElementById('status');
      if (el) { el.textContent = text || ''; }
    };
  </script>
</body>
</html>
